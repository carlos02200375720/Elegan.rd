name: Build Android (APK y AAB)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-movil.yml"

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Compilar APK y AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # Cargar primero los metadatos remotos para que sdkmanager detecte todas las licencias.
          "$SDKMANAGER" --list >/dev/null
          # La sustitución de proceso evita que SIGPIPE de "yes" aborte el paso por pipefail.
          "$SDKMANAGER" --licenses < <(yes)
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Preparar firma de publicación
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_STORE_PASSWORD" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No se configuró la firma Android. Se generará el APK de prueba; el AAB firmado se omitirá."
          fi

      - name: Preparar firma debug
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Compilar APK de prueba
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: elegan-apk-pruebas
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Compilar AAB firmado para Play Store
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: gradle --no-daemon :app:bundleRelease

      - name: Publicar AAB para Play Store
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: elegan-aab-play-store
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 1

      - name: Resumen de compilación
        if: always()
        run: |
          {
            echo "## Compilación Android"
            echo "- APK de prueba: se genera en cada ejecución."
            if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
              echo "- AAB firmado: compilado para Google Play."
            else
              echo "- AAB firmado: omitido; faltan los secretos de firma."
            fi
            echo "- IPA: este repositorio no contiene un proyecto iOS/Xcode; no se puede generar un IPA desde el proyecto Android actual."
          } >> "$GITHUB_STEP_SUMMARY"
